quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Desabilita o scheduler durante os testes para não disparar cron jobs
quarkus.scheduler.enabled=false

# URLs fictícias para os clientes REST (serão mockados com @InjectMock)
quarkus.rest-client.fn-alerta-api.url=http://localhost:9999
quarkus.rest-client.fn-relatorio-api.url=http://localhost:9998
