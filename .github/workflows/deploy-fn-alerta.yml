name: Deploy - fn-alerta-urgencia

on:
  push:
    branches: [ main ]
    paths:
      - 'azure-functions/fn-alerta-urgencia/**'
  workflow_dispatch:

jobs:
  deploy-fn-alerta:
    name: Build e Deploy Azure Function - Alerta Urgência
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build da Azure Function
        working-directory: azure-functions/fn-alerta-urgencia
        run: mvn clean package -B

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy para Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: 'fn-alerta-urgencia-tch4'
          package: 'azure-functions/fn-alerta-urgencia/target/azure-functions/fn-alerta-urgencia-tch4'

      - name: Configurar variáveis SMTP na Azure Function
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az functionapp config appsettings set \
              --name fn-alerta-urgencia-tch4 \
              --resource-group techchallenge-rg \
              --settings \
                SMTP_HOST="${{ secrets.SMTP_HOST }}" \
                SMTP_PORT="${{ secrets.SMTP_PORT }}" \
                SMTP_USER="${{ secrets.SMTP_USER }}" \
                SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
                EMAIL_DESTINATARIO="${{ secrets.EMAIL_DESTINATARIO }}" \
                EMAIL_REMETENTE="${{ secrets.EMAIL_REMETENTE }}"
