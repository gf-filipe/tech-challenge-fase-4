services:

  postgres:
    image: postgres:15
    container_name: postgres-feedback
    environment:
      POSTGRES_DB: feedbackdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: feedback-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/feedbackdb
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_REST_CLIENT_FN_ALERTA_API_URL: https://fn-alerta-urgencia-tch4.azurewebsites.net
      QUARKUS_REST_CLIENT_FN_RELATORIO_API_URL: https://fn-relatorio-semanal-tch4.azurewebsites.net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/q/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data: